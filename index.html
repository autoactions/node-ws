<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Matrix - Real World</title>
    <style>
        /* --- 全局与字体 --- */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap'); /* 引入复古像素字体 */

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'VT323', 'Courier New', monospace; /* 优先使用像素字体 */
            color: #0F0;
        }

        /* --- 画布 (数字雨) --- */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            filter: blur(0.5px); /* 给背景雨一点点模糊，突出前景终端 */
        }

        /* --- CRT 屏幕特效层 (关键改进) --- */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100; /* 最顶层 */
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; /* 模拟扫描线 */
            pointer-events: none; /* 让鼠标能穿透这层点击下面的内容 */
            animation: flicker 0.15s infinite; /* 屏幕微闪 */
        }

        /* 屏幕四周的暗角 (Vignette) */
        .crt-overlay::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 101;
        }

        /* --- 终端窗口 --- */
        #terminal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 900px;
            height: 60%;
            background-color: rgba(0, 10, 0, 0.9); /*稍微带点绿的黑 */
            border: 1px solid #33ff33;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2), inset 0 0 20px rgba(0, 50, 0, 0.5);
            z-index: 10;
            padding: 25px;
            overflow-y: hidden; /* 隐藏滚动条 */
            font-size: 1.4rem;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(50, 255, 50, 0.8); /* 文字发光 Bloom */
        }

        .line { margin-bottom: 5px; word-wrap: break-word; }
        .prompt { color: #00ff00; font-weight: bold; margin-right: 10px; }
        .command-text { color: #ccffcc; } /* 输入的命令稍微白一点 */
        .system-text { color: #00cc00; }  /* 系统输出标准绿 */
        .error-text { color: #ff3333; text-shadow: 0 0 5px red; } /* 错误信息用红色 */

        /* 闪烁光标 */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: #0F0;
            animation: blink 1s step-end infinite;
            vertical-align: sub;
            box-shadow: 0 0 10px #0F0;
        }

        /* 动画定义 */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes flicker { 0% { opacity: 0.97; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

    </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <canvas id="matrixCanvas"></canvas>

    <div id="terminal">
        <div id="output"></div>
        <span class="cursor"></span>
    </div>

    <script>
        // --- Matrix Digital Rain Logic (优化版) ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;
        
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = [];

        for(let x = 0; x < columns; x++) {
            rainDrops[x] = Math.random() * canvas.height / fontSize; // 随机初始化高度，不再是一条直线开始
        }

        const draw = () => {
            // 降低透明度，让拖尾更长更平滑
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for(let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                
                // 细节改进：
                // 1. 每一列的“领头”字符是白色的 (Highness)
                ctx.fillStyle = '#FFF'; 
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                // 2. 领头字符上面的字符重新绘制为绿色（覆盖刚才的白色，形成只有最下面一个是白色的效果）
                if(rainDrops[i] * fontSize > fontSize * 2){
                     ctx.fillStyle = '#0F0';
                     // 重新绘制上一格，虽然会有轻微覆盖，但视觉上能制造出渐变感
                     ctx.fillText(alphabet.charAt(Math.floor(Math.random() * alphabet.length)), i * fontSize, (rainDrops[i]-1) * fontSize);
                }
                
                if(rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975){
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };
        setInterval(draw, 35);
        
        window.addEventListener('resize', () => {
             canvas.width = window.innerWidth;
             canvas.height = window.innerHeight;
        });

        // --- Terminal Logic ---
        const output = document.getElementById('output');
        const terminal = document.getElementById('terminal');
        
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // 增强版打字机，支持不同样式的文本
        async function typeLine(text, type = 'system') {
            const line = document.createElement('div');
            line.className = 'line';
            
            if (type === 'command') {
                const p = document.createElement('span');
                p.className = 'prompt';
                p.innerText = 'NEO@MATRIX:~$ ';
                line.appendChild(p);
                
                const t = document.createElement('span');
                t.className = 'command-text';
                line.appendChild(t);
                output.appendChild(line);
                
                for(let c of text){
                    t.innerText += c;
                    await sleep(Math.random() * 50 + 50); // 打字速度
                }
            } else if (type === 'error') {
                line.className += ' error-text';
                output.appendChild(line);
                line.innerText = '[ERROR] ' + text;
                // 错误信息不需要逐字显示，直接弹出更有冲击力
            } else {
                line.className += ' system-text';
                output.appendChild(line);
                for(let c of text){
                    line.innerText += c;
                    terminal.scrollTop = terminal.scrollHeight;
                    await sleep(10); // 系统输出速度快
                }
            }
            
            terminal.scrollTop = terminal.scrollHeight;
            await sleep(200);
        }

        async function startScenario() {
            await sleep(1000);
            await typeLine("Wake up, Neo...", 'system');
            await sleep(2000);
            
            await typeLine("ssh -p 22 root@zion_mainframe", 'command');
            await sleep(500);
            await typeLine("Authenticating...", 'system');
            await sleep(800);
            await typeLine("Access DENIED. Security protocol engaged.", 'error');
            await sleep(500);
            
            await typeLine("run bypass_v2.exe -force", 'command');
            await sleep(500);
            await typeLine("Injecting payload...", 'system');
            
            // 模拟复杂的输出流
            const codeLines = [
                "0x4F 0xE2 memory_dump...",
                "Overriding kernel panic...",
                "Decoupling sector 7G...",
                "Matrix linkage: 98%..."
            ];
            
            for(let code of codeLines) {
                await typeLine(code, 'system');
                await sleep(100);
            }

            await sleep(1000);
            await typeLine("SYSTEM BREACHED.", 'system');
            await sleep(1000);
            await typeLine("Follow the white rabbit.", 'system');
            await typeLine("Knock, knock.", 'system');
        }

        startScenario();

    </script>
</body>
</html>
